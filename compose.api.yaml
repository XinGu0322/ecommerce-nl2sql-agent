
services:
  nl2sql-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: ecommerce-nl2sql-api:0.1.0
    container_name: ds-nl2sql-api

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - type: bind
        source: ./conf/app_config.docker.yaml
        target: /app/conf/app_config.yaml
        read_only: true


    healthcheck:
      test: >-
        python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

